[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydemi"
dynamic = ["version"]
description = "Interpretable, fixed-length descriptors from a VASP CHGCAR, with a browser interface."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shubham Maurya, CMS Lab, IIT Kanpur" }]
requires-python = ">=3.10"
keywords = ["charge density", "DFT", "descriptors", "featurization", "materials informatics", "VASP"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.optional-dependencies]
full = ["pymatgen>=2023.3.10"]                  # optional: pymatgen Structure in / out
gui = ["streamlit>=1.65", "plotly>=6.0", "lightgbm>=4.0"]   # pydemi gui: the browser interface, with property estimates
ml = ["torch>=2.0", "e3nn>=0.5", "ase>=3.22"]     # pydemi predict: ChargE3Net densities from a structure
props = ["lightgbm>=4.0"]                        # material properties predicted from the descriptors
dev = ["pytest>=7.0", "mypy>=1.8", "pandas-stubs", "scipy-stubs"]

[project.urls]
Homepage = "https://github.com/CMSLabIITK/pydemi"
Issues = "https://github.com/CMSLabIITK/pydemi/issues"

[project.scripts]
pydemi = "pydemi.cli:main"

[tool.hatch.version]
path = "src/pydemi/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydemi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = []

[tool.mypy]
python_version = "3.10"
files = ["src/pydemi"]
strict = true
exclude = ["src/pydemi/gui/(app|plots|viewer|properties)\\.py$", "src/pydemi/ml/model\\.py$"]   # UI code (tested by tests/gui); the vendored network

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "e3nn", "e3nn.*", "ase", "ase.*", "lightgbm", "lightgbm.*"]   # the ml and props extras: untyped, optional
ignore_missing_imports = true
