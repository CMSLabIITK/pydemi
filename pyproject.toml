[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydemi"
version = "0.1.0.dev0"
description = "Interpretable, fixed-length descriptors from DFT charge-density grids."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shubham Maurya, CMS Lab, IIT Kanpur" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.optional-dependencies]
full = ["pymatgen>=2023.3.10", "spglib>=2.0", "matminer>=0.9"]
dev = ["pytest>=7.0", "mypy>=1.8", "pandas-stubs", "scipy-stubs"]

[project.scripts]
pydemi = "pydemi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydemi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", "paper", "tools"]

[tool.mypy]
python_version = "3.10"
files = ["src/pydemi/io", "src/pydemi/core", "src/pydemi/fields", "src/pydemi/operators",
         "src/pydemi/constants.py", "src/pydemi/data"]
strict = true
