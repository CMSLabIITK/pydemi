name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"

jobs:
  test:
    # the full install (GUI included) on the three operating systems users have
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: OpenMP for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,gui,props,dev]" pytest-github-actions-annotate-failures
      - name: Tests
        run: pytest -q

  core-only:
    # without the gui extra: the library must not need Streamlit or plotly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (GUI tests skip)
        run: pytest -q
      - name: pydemi gui explains how to install the extra
        run: |
          pydemi gui --no-browser 2>&1 | tee out.txt || true
          grep -q 'pip install "pydemi\[gui\]"' out.txt
      - name: pydemi predict explains how to install the extra
        run: |
          pydemi predict x.cif --out-dir out 2>&1 | tee out.txt || true
          grep -q 'pip install "pydemi\[ml\]"' out.txt

  ml:
    # the ml extra (ChargE3Net on CPU): predictions match the original code on every OS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: OpenMP for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install (CPU PyTorch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e ".[ml,gui,dev]" pytest-github-actions-annotate-failures
      - name: Tests (ML and GUI)
        run: pytest -q tests/ml tests/gui

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"
      - name: Type check (mypy --strict)
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel with the GUI and start it
        run: |
          pip install "$(ls dist/*.whl)[gui]"
          cd /tmp
          python -c "import pydemi; print(pydemi.__version__, len(pydemi.descriptor_names()))"
          pydemi gui --no-browser --port 8599 &
          for i in $(seq 30); do curl -sf http://localhost:8599/_stcore/health && break; sleep 1; done
          curl -sf http://localhost:8599/_stcore/health
